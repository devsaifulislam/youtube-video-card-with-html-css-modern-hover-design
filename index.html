<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Video Card with HTML &amp; CSS ▶️ | Modern Hover Design</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<article class="video-card">
  <a href="#" class="thumbnail">
    <img
      src="https://picsum.photos/id/48/800/450"
      alt="Laptop showing programming code"
    >

    <span class="play-button">▶</span>
    <span class="video-duration">08:24</span>
  </a>

  <div class="video-details">
    <div class="channel-avatar">SK</div>

    <div class="video-info">
      <h2>Build a Modern Website with HTML & CSS</h2>

      <a href="#" class="channel-name">
        Dev Saiful
        <span class="verified">✓</span>
      </a>

      <p>125K views <span>•</span> 2 days ago</p>
    </div>

    <button class="more-button" type="button" aria-label="More options">
      ⋮
    </button>
  </div>
</article>
</body>
</html>
